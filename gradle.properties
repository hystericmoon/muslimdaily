org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Address that "Report an error" pre-fills. Leave empty to let the user choose.
muslimdaily.reportEmail=hosnirachmani@gmail.com
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory

# Connected-device test runs (e.g. :app:generateSideloadBaselineProfile) otherwise uninstall the
# app they ran against when they finish, deleting its data on the phone. Keep it installed.
android.injected.androidTest.leaveApksInstalledAfterRun=true
