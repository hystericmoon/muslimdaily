function cta(n, N) {
  const w = world('dark', { blobs: [['b1', -300, 500, 900], ['b2', 450, 100, 800]] });
  const lw = 840, lh = 174 * lw / 918, y = 470;
  [380, 620, 880, 1160].forEach((d, i) => { const g = el('div', 'ripple', w); Object.assign(g.style, { left: W / 2 - d / 2 + 'px', top: y + lh / 2 - d / 2 + 'px', width: d + 'px', height: d + 'px', opacity: [.08, .06, .04, .025][i], borderWidth: '3px' }); });
  lockup(w, (W - lw) / 2, y, lw, '#81D5CE', '#E2E3DF');
  const c = el('div', 'claims', w, CTA); Object.assign(c.style, { top: y + lh + 90 + 'px', fontSize: '40px', padding: '0 60px', lineHeight: '1.3' });
  const u = el('div', 'url', w, URL_TXT); Object.assign(u.style, { top: y + lh + 210 + 'px', fontSize: '34px' });
  frame(w, n, N);
  return w;
}

// One phone drawn twice: light screen above the Wasl line, dark below it. The line is the edge.
function split(src, copy, o, carN, y0) {
  const ang = -9, slope = Math.tan(ang * Math.PI / 180), cos = Math.cos(ang * Math.PI / 180), sin = Math.sin(ang * Math.PI / 180);
  const yAt = (x) => y0 + slope * x;
  const both = el('div', 'world', root);
  const lightW = world('light', { blobs: BL });
  const darkW = world('dark', { blobs: [['b1', -200, 900, 900], ['b2', 500, 700, 800]] });
  both.appendChild(lightW); both.appendChild(darkW);
  darkW.style.clipPath = `polygon(0 ${yAt(0)}px, ${W}px ${yAt(W)}px, ${W}px ${H}px, 0 ${H}px)`;
  const base = { fx: 400, fy: 850, rz: ang, ...o };
  phone(lightW, SCR(src, 'light'), base); phone(darkW, SCR(src, 'dark'), base);
  scrim(lightW, 500);
  text(lightW, copy[LANG]);
  const th = 14, len = W - 150, x0 = 0;
  const ln = el('div', '', both);
  Object.assign(ln.style, { position: 'absolute', left: x0 + 'px', top: yAt(x0) - th / 2 + 'px', width: len / cos + 'px', height: th + 'px', background: '#1F5F5B', borderRadius: `0 ${th / 2}px ${th / 2}px 0`, transformOrigin: '0 50%', transform: `rotate(${ang}deg)`, zIndex: 60 });
  const L = len / cos, ex = x0 + L * cos, ey = yAt(x0) + L * sin, gap = th / 2 + th / 2;
  const dot = el('div', '', both); Object.assign(dot.style, { position: 'absolute', width: th + 'px', height: th + 'px', borderRadius: '50%', background: '#C9A227', left: ex + cos * gap - th / 2 + 'px', top: ey + sin * gap - th / 2 + 'px', zIndex: 60 });
  if (carN) frame(lightW, carN, 5, darkW);
  return both;
}
