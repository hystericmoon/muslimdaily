name: Release

# Publishes the sideload build (R8, not debuggable; debug package and shared key) that the
# in-app updater installs, and builds the Play bundle as a workflow artifact.
# Runs when versionName in app/build.gradle.kts changes on main to a version that has no release
# yet, or when a tag like v0.2.0 is pushed. The release and its tag are created here. Feature
# branches never publish: a version bump releases only once its PR is merged.
on:
  push:
    branches: [main]
    paths: ["app/build.gradle.kts", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Releases are published from main or a version tag, not $GITHUB_REF; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version"; exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$version already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'
      - name: Android SDK 37
        if: steps.version.outputs.skip != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      # The shared design system (private repo) is built from source into mavenLocal; its version
      # is pinned once, as hahoDesign in gradle/libs.versions.toml, and checked out at tag v<version>.
      - name: haho-design version
        id: haho
        if: steps.version.outputs.skip != 'true'
        run: echo "version=$(sed -n 's/^hahoDesign = "\(.*\)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.version.outputs.skip != 'true'
        with:
          repository: hystericmoon/haho-design
          ref: v${{ steps.haho.outputs.version }}
          path: .deps/haho-design
          ssh-key: ${{ secrets.HAHO_DESIGN_DEPLOY_KEY }}
      - name: Publish haho-design to mavenLocal
        if: steps.version.outputs.skip != 'true'
        working-directory: .deps/haho-design
        run: ./gradlew publishToMavenLocal --stacktrace
      - name: Build sideload APK
        if: steps.version.outputs.skip != 'true'
        run: |
          ./gradlew :app:assembleSideload
          cp app/build/outputs/apk/sideload/app-sideload.apk "adwam-${{ steps.version.outputs.version }}.apk"
      # The store (Play) bundle: release build type, Play content (docs/play-store.md, "Plan B").
      # Signed with the upload key when its secrets are set (see docs/release.md), unsigned
      # otherwise. Kept as a workflow artifact for upload to Play, not attached to the release.
      - name: Build Play bundle
        if: steps.version.outputs.skip != 'true'
        env:
          UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          suffix=unsigned
          if [[ -n "$UPLOAD_KEYSTORE" ]]; then
            echo "$UPLOAD_KEYSTORE" | base64 -d > upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$UPLOAD_STORE_PASSWORD" "$UPLOAD_KEY_ALIAS" "$UPLOAD_KEY_PASSWORD" > keystore.properties
            suffix=upload-signed
          else
            echo "::notice::No PLAY_UPLOAD_KEYSTORE secret: the Play bundle is unsigned."
          fi
          ./gradlew :app:bundleRelease
          mkdir -p play
          cp app/build/outputs/bundle/release/app-release.aab "play/adwam-${{ steps.version.outputs.version }}-$suffix.aab"
          rm -f upload.jks keystore.properties
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.skip != 'true'
        with:
          name: play-bundle
          path: play/*.aab
          retention-days: 90
      # The app's own What's new, which the in-app updater shows as plain text.
      - name: Release notes
        id: notes
        if: steps.version.outputs.skip != 'true'
        run: |
          python3 -I tools/release_notes.py "${{ steps.version.outputs.version }}" > release-notes.md
          [[ -s release-notes.md ]] || echo "empty=true" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.skip != 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Adwam ${{ steps.version.outputs.version }}
          # A version with a suffix (0.6.0-beta.1) is a pre-release: only the beta channel sees it.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.version.outputs.version, '-') }}
          files: adwam-*.apk
          body_path: release-notes.md
          # Only when the version has no What's new entry (GitHub's list of merged PRs instead).
          generate_release_notes: ${{ steps.notes.outputs.empty == 'true' }}
