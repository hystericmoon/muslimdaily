name: Release

# Push a tag like v0.2.0 to publish a sideload build. The in-app updater (debug builds) reads the
# latest release of this repository and installs its .apk asset.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Check the tag matches versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$tag\"" app/build.gradle.kts || { echo "Tag $tag does not match versionName"; exit 1; }
      - name: Build sideload APK
        run: ./gradlew :app:assembleDebug
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk "muslimdaily-${GITHUB_REF_NAME#v}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: muslimdaily-*.apk
          generate_release_notes: true
