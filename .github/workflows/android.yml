name: Android

on:
  # Branches are checked through their PR; a push to a branch as well would run everything twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validator tests
        run: python -m unittest discover -s tools -v
      - name: JSON is generated from the spreadsheets
        run: |
          python tools/build_content.py
          git diff --exit-code content/ || (echo "content/*.json is out of date: run python3 tools/build_content.py and commit" && exit 1)

  android:
    name: Build, lint, test
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup
        with:
          haho-design-key: ${{ secrets.HAHO_DESIGN_DEPLOY_KEY }}
      # verifyRoborazziDebug runs the unit tests and compares every screenshot with
      # docs/screenshots. Those are recorded on this runner by the Screenshots workflow; after a
      # UI change, run it on the branch (Actions → Screenshots → Run workflow).
      - name: Lint, unit and UI tests (Robolectric), screenshots compared
        run: ./gradlew :app:lintDebug :app:verifyRoborazziDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/

  # Runs alongside the tests rather than after them.
  apks:
    name: Debug and release builds
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup
        with:
          haho-design-key: ${{ secrets.HAHO_DESIGN_DEPLOY_KEY }}
      - name: Debug and release builds
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleSideload
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/
