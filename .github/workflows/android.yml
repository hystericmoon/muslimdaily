name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validator tests
        run: python -m unittest discover -s tools -v
      - name: JSON is generated from the spreadsheets
        run: |
          python tools/build_content.py
          git diff --exit-code content/ || (echo "content/*.json is out of date: run python3 tools/build_content.py and commit" && exit 1)

  android:
    name: Build, lint, test
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      # The shared design system (private repo) is built from source into mavenLocal; its version
      # is pinned once, as hahoDesign in gradle/libs.versions.toml, and checked out at tag v<version>.
      - name: haho-design version
        id: haho
        run: echo "version=$(sed -n 's/^hahoDesign = "\(.*\)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hystericmoon/haho-design
          ref: v${{ steps.haho.outputs.version }}
          path: .deps/haho-design
          ssh-key: ${{ secrets.HAHO_DESIGN_DEPLOY_KEY }}
      - name: Publish haho-design to mavenLocal
        working-directory: .deps/haho-design
        run: ./gradlew publishToMavenLocal --stacktrace
      - name: Lint, unit and UI tests (Robolectric)
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest --stacktrace
      - name: Debug and release builds
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleSideload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/
