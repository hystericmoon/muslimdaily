name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validator tests
        run: python -m unittest discover -s tools -v
      - name: JSON is generated from the spreadsheets
        run: |
          python tools/build_content.py
          git diff --exit-code content/ || (echo "content/*.json is out of date: run python3 tools/build_content.py and commit" && exit 1)

  android:
    name: Build, lint, test
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Lint, unit and UI tests (Robolectric)
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :wear:lintDebug :wear:testDebugUnitTest --stacktrace
      - name: Debug and release builds
        run: ./gradlew :app:assembleDebug :app:assembleRelease :wear:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            wear/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/
            wear/build/outputs/apk/
