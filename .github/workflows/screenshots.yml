name: Screenshots

# Records docs/screenshots on the branch it is run on (Actions → Screenshots → Run workflow), so
# the baselines come from the same Linux runner that CI compares them on: renders differ between
# machines (fonts, rasteriser), so shots recorded on a laptop never match CI. Commits the new
# shots to the branch, then starts the Android workflow on that commit to verify them.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Not on main
        if: github.ref == 'refs/heads/main'
        run: echo "Run this on a feature branch; main only takes merged PRs." && exit 1
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup
        with:
          haho-design-key: ${{ secrets.HAHO_DESIGN_DEPLOY_KEY }}
      - name: Record
        run: ./gradlew :app:recordRoborazziDebug --stacktrace
      - name: Commit the shots
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changed."
          else
            git commit -m "Record screenshots on CI"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # A push made with the workflow token starts no workflows, so verify the new commit here.
      - name: Verify on the new commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref "$GITHUB_REF_NAME"
