name: Android setup
description: >
  JDK 21, Gradle and Android SDK 37.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
    - uses: gradle/actions/setup-gradle@v4
    - name: Android SDK 37
      shell: bash
      # pipefail is on in composite actions; yes ends with a broken pipe once sdkmanager is done.
      run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
